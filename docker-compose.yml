services:
  timescaledb:
    image: timescale/timescaledb:latest-pg17
    command: >
      postgres
      -c shared_buffers=2GB
      -c effective_cache_size=6GB
      -c work_mem=32MB
      -c maintenance_work_mem=512MB
      -c max_worker_processes=8
      -c timescaledb.max_background_workers=6
    environment:
      POSTGRES_USER: kalshi
      POSTGRES_PASSWORD: kalshi
      POSTGRES_DB: kalshi
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    restart: unless-stopped
    labels:
      - autoheal=true
    mem_limit: 8g
    mem_reservation: 2g
    cpus: 4.0
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kalshi -d kalshi"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    volumes:
      - ./storage/redis.conf:/usr/local/etc/redis/redis.conf:ro
    restart: unless-stopped
    labels:
      - autoheal=true
    mem_limit: 1g
    mem_reservation: 128m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrator:
    build:
      context: .
      dockerfile: storage/Dockerfile
    environment:
      TIMESCALE_DSN: postgresql://kalshi:kalshi@timescaledb:5432/kalshi
    depends_on:
      timescaledb:
        condition: service_healthy

  fetcher:
    build:
      context: .
      dockerfile: fetcher/Dockerfile
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      TIMESCALE_DSN: postgresql://kalshi:kalshi@timescaledb:5432/kalshi
      KALSHI_PRIVATE_KEY_PATH: /run/secrets/kalshi.pem
    ports:
      - "8080:8080"
    volumes:
      - ./fetcher/config.yaml:/app/fetcher/config.yaml:ro
      - ./kalshi.pem:/run/secrets/kalshi.pem:ro
    depends_on:
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped
    labels:
      - autoheal=true
    mem_limit: 1g
    mem_reservation: 256m
    cpus: 2.0
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      TIMESCALE_DSN: postgresql://kalshi:kalshi@timescaledb:5432/kalshi
      TRADER_URL: http://trader:8091
    ports:
      - "8090:8090"
    volumes:
      - ./ui/config.yaml:/app/ui/config.yaml:ro
    depends_on:
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      fetcher:
        condition: service_started
      trader:
        condition: service_started
    restart: unless-stopped
    labels:
      - autoheal=true
    mem_limit: 1g
    mem_reservation: 128m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  trader:
    build:
      context: .
      dockerfile: trader/Dockerfile
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      TIMESCALE_DSN: postgresql://kalshi:kalshi@timescaledb:5432/kalshi
      KALSHI_PRIVATE_KEY_PATH: /run/secrets/kalshi.pem
      TRADING_LIVE_ENABLED: "True"
    ports:
      - "8091:8091"
    volumes:
      - ./trader/config.yaml:/app/trader/config.yaml:ro
      - ./kalshi.pem:/run/secrets/kalshi.pem:ro
    depends_on:
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      fetcher:
        condition: service_started
    restart: unless-stopped
    labels:
      - autoheal=true
    mem_limit: 1g
    mem_reservation: 256m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/api/healthz', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  autoheal:
    image: willfarrell/autoheal:latest
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: "10"
      AUTOHEAL_START_PERIOD: "60"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    depends_on:
      - redis
      - timescaledb
      - fetcher
      - trader
      - ui

volumes:
  timescale_data:
