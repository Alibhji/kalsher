services:
  timescaledb:
    image: timescale/timescaledb:latest-pg17
    environment:
      POSTGRES_USER: kalshi
      POSTGRES_PASSWORD: kalshi
      POSTGRES_DB: kalshi
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kalshi -d kalshi"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    volumes:
      - ./storage/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrator:
    build:
      context: .
      dockerfile: storage/Dockerfile
    environment:
      TIMESCALE_DSN: postgresql://kalshi:kalshi@timescaledb:5432/kalshi
    depends_on:
      timescaledb:
        condition: service_healthy

  fetcher:
    build:
      context: .
      dockerfile: fetcher/Dockerfile
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      TIMESCALE_DSN: postgresql://kalshi:kalshi@timescaledb:5432/kalshi
      KALSHI_PRIVATE_KEY_PATH: /run/secrets/kalshi.pem
    ports:
      - "8080:8080"
    volumes:
      - ./fetcher/config.yaml:/app/fetcher/config.yaml:ro
      - ./kalshi.pem:/run/secrets/kalshi.pem:ro
    depends_on:
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      TIMESCALE_DSN: postgresql://kalshi:kalshi@timescaledb:5432/kalshi
      TRADER_URL: http://trader:8091
    ports:
      - "8090:8090"
    volumes:
      - ./ui/config.yaml:/app/ui/config.yaml:ro
    depends_on:
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      fetcher:
        condition: service_started
      trader:
        condition: service_started
    restart: unless-stopped

  trader:
    build:
      context: .
      dockerfile: trader/Dockerfile
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      TIMESCALE_DSN: postgresql://kalshi:kalshi@timescaledb:5432/kalshi
      KALSHI_PRIVATE_KEY_PATH: /run/secrets/kalshi.pem
      TRADING_LIVE_ENABLED: "True"
    ports:
      - "8091:8091"
    volumes:
      - ./trader/config.yaml:/app/trader/config.yaml:ro
      - ./kalshi.pem:/run/secrets/kalshi.pem:ro
    depends_on:
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      fetcher:
        condition: service_started
    restart: unless-stopped

volumes:
  timescale_data:
